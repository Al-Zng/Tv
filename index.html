<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Tv Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --sidebar-bg: #22596b; 
            --main-bg: #1a1a1a; 
            --search-bg: #f59f34; 
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 90px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }

        body { background-color: var(--main-bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            display: flex; flex-direction: column; padding: 40px 15px;
            z-index: 100; transition: width 0.3s ease;
        }
        body.channels-focused .sidebar { width: var(--sidebar-collapsed-width); }

        .search-btn {
            width: 55px; height: 55px; background: var(--search-bg);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 22px; margin-bottom: 40px; border: none; outline: none;
        }

        .menu-item {
            height: 55px; display: flex; align-items: center; color: #a0c4d1;
            padding: 0 18px; border-radius: 12px; transition: 0.3s; outline: none; border: 2px solid transparent;
        }
        .menu-item i { min-width: 30px; margin-left: 20px; font-size: 22px; }
        body.channels-focused .menu-item span { display: none; }
        body.channels-focused .menu-title { display: none; }

        .focusable:focus {
            transform: scale(1.08); border-color: white;
            background: rgba(255, 255, 255, 0.1); color: white;
        }

        /* --- Main --- */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .top-logo { font-size: 42px; font-weight: 800; color: #4db8d8; margin-bottom: 30px; }
        
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .channel-card {
            aspect-ratio: 16 / 9; background: white; border-radius: 15px;
            overflow: hidden; outline: none; border: 4px solid transparent;
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s; position: relative;
        }
        .channel-card:focus { transform: scale(1.1); border-color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .channel-card img { width: 80%; height: 80%; object-fit: contain; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            display: flex; align-items: flex-end; padding: 10px;
        }
        .channel-name { font-weight: bold; font-size: 16px; color: white; }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #00d166; padding: 12px 30px; border-radius: 50px;
            display: none; font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="search-btn focusable" tabindex="0"><i class="fas fa-search"></i></div>
        <div class="menu-title" style="margin-bottom:20px; font-weight:bold;">المواضيع المثبتة</div>
        <div class="menu-item focusable" tabindex="0"><i class="fas fa-tv"></i> <span>القنوات</span></div>
    </aside>

    <main class="main-content">
        <div class="top-logo">Iraq Tv</div>
        <div class="movies-grid" id="mainGrid"></div>
    </main>

    <div id="toast">تشغيل في VLC...</div>

    <script>
        // كافة القنوات من ملفك الأصلي indexl.html
        const channels = [
            { name: "الرابعة الرياضية", url: "https://rtmp.itiraq.tv/live/sports/playlist.m3u8", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Al_Rabiaa_Sports_TV_logo.png/600px-Al_Rabiaa_Sports_TV_logo.png" },
            { name: "العراقية الإخبارية", url: "https://cdn.catiacast.video/abr/78054972db7708422595bc96c6e024ac/playlist.m3u8", img: "2.jpeg" },
            { name: "الاخبارية العامة", url: "http://cdn.catiacast.video/abr/8d2ffb0aba244e8d9101a9488a7daa05/playlist.m3u8", img: "1.jpeg" },
            { name: "MBC Iraq", url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8", img: "https://upload.wikimedia.org/wikipedia/commons/9/99/MBC_Iraq.svg" },
            { name: "Utv", url: "https://mn-nl.mncdn.com/utviraqi2/64c80359/index.m3u8", img: "https://upload.wikimedia.org/wikipedia/commons/5/55/Utv_logo.png" },
            { name: "الشرقية", url: "https://indexforce.com/home/mystream/playlist.m3u8", img: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Al_Sharqiya.png" },
            { name: "الرابعة نيوز", url: "https://rtmp.itiraq.tv/live/news/playlist.m3u8", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg/500px-%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg.png" }
        ];

        const grid = document.getElementById('mainGrid');
        const toast = document.getElementById('toast');

        channels.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card focusable';
            card.tabIndex = 0;
            card.innerHTML = `<img src="${ch.img}"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
            card.onclick = () => openVLC(ch.url);
            grid.appendChild(card);
        });

        function openVLC(url) {
            toast.style.display = 'block';
            // الأمر المباشر لفتح VLC دون تدخل المتصفح
            window.location.assign("vlc://" + url);
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        document.addEventListener('focusin', (e) => {
            if (e.target.closest('.movies-grid')) document.body.classList.add('channels-focused');
            else document.body.classList.remove('channels-focused');
        });

        // نظام التنقل بالأسهم (نفس الميكانيكية التي طلبتها)
        document.addEventListener('keydown', (e) => {
            const focusables = Array.from(document.querySelectorAll('.focusable'));
            let current = document.activeElement;
            if (e.key === 'Enter') {
                if(current.onclick) current.onclick();
                return;
            }

            const rect = current.getBoundingClientRect();
            let next = null, minDist = Infinity;
            focusables.forEach(el => {
                if (el === current) return;
                const r = el.getBoundingClientRect();
                let valid = false;
                if (e.key === 'ArrowRight' && r.left >= rect.right - 20) valid = true;
                if (e.key === 'ArrowLeft' && r.right <= rect.left + 20) valid = true;
                if (e.key === 'ArrowDown' && r.top >= rect.bottom - 20) valid = true;
                if (e.key === 'ArrowUp' && r.bottom <= rect.top + 20) valid = true;
                if (valid) {
                    const dist = Math.hypot(r.left - rect.left, r.top - rect.top);
                    if (dist < minDist) { minDist = dist; next = el; }
                }
            });
            if (next) { e.preventDefault(); next.focus(); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        });

        window.onload = () => document.querySelector('.channel-card').focus();
    </script>
</body>
</html>
