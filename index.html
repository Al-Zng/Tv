<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Tv Pro - TV Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --sidebar-bg: #1a2a33; 
            --main-bg: #050505; 
            --search-bg: #f59f34; 
            --accent-green: #00d166;
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 90px;
            --text-blue: #4db8d8;
        }

        /* منع التحديد والنسخ */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', sans-serif; 
            user-select: none; 
            outline: none;
        }

        body { 
            background-color: var(--main-bg); 
            color: white; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            transition: background 0.3s;
        }

        /* --- وضع الأداء (Performance Mode) --- */
        body.perf-low * {
            animation: none !important;
            transition: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
        }
        body.perf-low .channel-card:focus {
            transform: scale(1.02) !important; /* تكبير بسيط جداً بدون تنعيم */
            border: 3px solid var(--accent-green) !important;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width); 
            background-color: var(--sidebar-bg);
            display: flex; 
            flex-direction: column; 
            padding: 20px 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            position: relative;
        }

        .channels-focused .sidebar {
            width: var(--sidebar-collapsed-width);
        }

        .logo {
            font-size: 28px; font-weight: 800; color: var(--text-blue);
            padding: 0 30px 40px 30px; white-space: nowrap; overflow: hidden;
        }

        .channels-focused .logo span { display: none; }

        .menu-items { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .menu-item {
            padding: 15px 30px; display: flex; align-items: center; gap: 20px;
            cursor: pointer; color: #a0c4d1; transition: 0.2s; white-space: nowrap;
        }

        .menu-item i { font-size: 22px; min-width: 30px; text-align: center; }

        .menu-item span { font-size: 18px; font-weight: 500; }

        .channels-focused .menu-item span { display: none; }

        .menu-item:focus, .menu-item.active {
            background-color: rgba(255, 255, 255, 0.1); color: white;
        }

        .menu-item:focus { border-right: 5px solid var(--accent-green); }

        /* --- Main Content --- */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            padding: 40px; overflow: hidden; position: relative;
        }

        .header-actions {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }

        .category-title { font-size: 32px; font-weight: 700; }

        .search-trigger {
            background: #1e2e3a; padding: 12px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; color: #a0c4d1;
        }

        .search-trigger:focus { background: white; color: black; }

        /* --- Grid --- */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px; overflow-y: auto; padding: 10px 5px 100px 5px;
            scroll-behavior: smooth;
        }

        .channel-card {
            aspect-ratio: 1/1; background: #111; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.05); cursor: pointer;
        }

        .channel-card:focus {
            transform: scale(1.1); border-color: var(--accent-green);
            box-shadow: 0 10px 30px rgba(0, 209, 102, 0.3); z-index: 10;
        }

        .channel-card img { width: 65%; height: 65%; object-fit: contain; pointer-events: none; }

        .card-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9));
            text-align: center; font-size: 14px; font-weight: bold; border-radius: 0 0 15px 15px;
        }

        /* --- Search Overlay --- */
        .search-overlay {
            position: fixed; inset: 0; background: var(--main-bg); z-index: 2000;
            display: none; flex-direction: column; padding: 50px;
        }

        .search-overlay.active { display: flex; }

        .search-input-container {
            display: flex; align-items: center; gap: 20px; margin-bottom: 40px;
            background: #1e2e3a; padding: 15px 30px; border-radius: 15px;
        }

        .search-input-container input {
            background: transparent; border: none; color: white; font-size: 24px; flex: 1;
        }

        /* --- نافذة الإعدادات (Settings Modal) --- */
        .tv-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 5000; display: none; align-items: center; justify-content: center;
        }
        .tv-modal-content {
            background: var(--sidebar-bg); padding: 40px; border-radius: 25px;
            border: 2px solid var(--text-blue); width: 600px;
        }
        .tv-modal-header { font-size: 28px; color: var(--text-blue); margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .tv-setting-item {
            padding: 20px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); transition: 0.2s;
        }
        .tv-setting-item:focus { background: white; color: black; }
        .setting-status { font-weight: bold; color: var(--accent-green); }
        .tv-setting-item:focus .setting-status { color: #008f45; }

        #status-toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--accent-green); color: black; padding: 15px 30px;
            border-radius: 50px; display: none; z-index: 3000; font-weight: bold; font-size: 18px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="status-toast">جاري التشغيل...</div>

    <aside class="sidebar">
        <div class="logo">Iraq Tv <span>Max</span></div>
        <nav class="menu-items">
            <div class="menu-item focusable active" tabindex="0" onclick="filterCategory('iraq', this)"><i class="fas fa-flag"></i> <span>قنوات العراق</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('mbc', this)"><i class="fas fa-play"></i> <span>مجموعة MBC</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('sports', this)"><i class="fas fa-running"></i> <span>القنوات الرياضية</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('doc', this)"><i class="fas fa-atlas"></i> <span>الوثائقيات</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('bein', this)"><i class="fas fa-futbol"></i> <span>beIN Sports</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('osn', this)"><i class="fas fa-film"></i> <span>باقة OSN</span></div>
            <div class="menu-item focusable" tabindex="0" onclick="filterCategory('netflix', this)"><i class="fab fa-netflix"></i> <span>VIP Netflix</span></div>
            
            <div class="menu-item focusable" tabindex="0" onclick="toggleSettings()" style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05);"><i class="fas fa-cog"></i> <span>الإعدادات</span></div>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header-actions">
            <div class="category-title" id="currentCategory">قنوات العراق</div>
            <div class="search-trigger focusable" tabindex="0" id="searchIcon">
                <i class="fas fa-search"></i>
                <span>بحث عن قناة...</span>
            </div>
        </div>

        <div class="movies-grid" id="mainGrid"></div>
    </main>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-input-container">
            <i class="fas fa-search" style="font-size: 24px; color: var(--text-blue);"></i>
            <input type="text" id="searchInput" placeholder="اكتب اسم القناة هنا..." tabindex="0">
            <i class="fas fa-times focusable" id="searchClose" tabindex="0" style="font-size: 24px; cursor: pointer;"></i>
        </div>
        <div class="movies-grid" id="searchResults"></div>
    </div>

    <div class="tv-modal" id="settingsModal">
        <div class="tv-modal-content">
            <div class="tv-modal-header">إعدادات التطبيق</div>
            
            <div class="tv-setting-item focusable" tabindex="0" id="perfOption" onclick="togglePerf()">
                <div>
                    <div style="font-size: 18px;">وضع الأداء (خفيف)</div>
                    <div style="font-size: 14px; opacity: 0.7;">تعطيل الأنميشن والظلال لتسريع التصفح</div>
                </div>
                <span class="setting-status" id="perfStatus">معطل</span>
            </div>

            <div class="tv-setting-item focusable" tabindex="0" onclick="toggleSettings()" style="margin-top: 20px; background: rgba(255,0,0,0.1); justify-content: center;">
                <span style="font-weight: bold;">إغلاق وحفظ</span>
            </div>
        </div>
    </div>

    <script>
        let data = {};
        let currentFocus = null;

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            const isVisible = modal.style.display === 'flex';
            modal.style.display = isVisible ? 'none' : 'flex';
            if(!isVisible) {
                document.getElementById('perfOption').focus();
            } else {
                document.querySelector('.menu-item.active').focus();
            }
        }

        function togglePerf() {
            const isLow = localStorage.getItem('lowPerfTV') !== 'true';
            localStorage.setItem('lowPerfTV', isLow);
            updatePerfUI(isLow);
        }

        function updatePerfUI(isLow) {
            document.getElementById('perfStatus').textContent = isLow ? "مفعل (خفيف)" : "معطل (قوي)";
            if(isLow) {
                document.body.classList.add('perf-low');
            } else {
                document.body.classList.remove('perf-low');
            }
        }

        function rebuildTab(gridId, list) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; font-size: 24px; color: #555;">لا توجد قنوات في هذه الفئة</div>';
                return;
            }
            list.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card focusable';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3C/svg%3E" data-src="${ch.img}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                    <div class="card-name">${ch.name}</div>
                `;
                card.onclick = () => openVLC(ch.url, ch.name);
                grid.appendChild(card);
            });
            initLazyLoading();
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            const titles = {
                iraq: 'قنوات العراق', mbc: 'مجموعة MBC', sports: 'القنوات الرياضية',
                doc: 'الوثائقيات', bein: 'beIN Sports', osn: 'باقة OSN', netflix: 'VIP Netflix'
            };
            document.getElementById('currentCategory').textContent = titles[cat];
            rebuildTab('mainGrid', data[cat] || []);
        }

        function openVLC(url, name) {
            const toast = document.getElementById('status-toast');
            toast.textContent = `جاري تشغيل ${name}...`;
            toast.style.display = 'block';
            window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(name)};end`;
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function initLazyLoading() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target.querySelector('img');
                        if (img && img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                        }
                    }
                });
            }, { rootMargin: '200px' });
            document.querySelectorAll('.channel-card').forEach(card => observer.observe(card));
        }

        function handleKeyNavigation(e) {
            const active = document.activeElement;
            if (!active || !active.classList.contains('focusable')) return;

            const grid = active.closest('.movies-grid');
            if (grid) {
                const cards = Array.from(grid.querySelectorAll('.focusable'));
                const index = cards.indexOf(active);
                const cols = Math.floor(grid.offsetWidth / 200);

                if (e.key === 'ArrowRight') {
                    if (index < cards.length - 1) cards[index + 1].focus();
                } else if (e.key === 'ArrowLeft') {
                    if (index > 0) cards[index - 1].focus();
                    else document.querySelector('.menu-item.active').focus();
                } else if (e.key === 'ArrowDown') {
                    if (index + cols < cards.length) cards[index + cols].focus();
                } else if (e.key === 'ArrowUp') {
                    if (index - cols >= 0) cards[index - cols].focus();
                    else document.getElementById('searchIcon').focus();
                }
            } else if (active.classList.contains('menu-item')) {
                if (e.key === 'ArrowDown') {
                    const next = active.nextElementSibling;
                    if (next && next.classList.contains('focusable')) next.focus();
                } else if (e.key === 'ArrowUp') {
                    const prev = active.previousElementSibling;
                    if (prev && prev.classList.contains('focusable')) prev.focus();
                } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
                    const firstCard = document.querySelector('#mainGrid .focusable');
                    if (firstCard) firstCard.focus();
                }
            } else if (active.id === 'searchIcon') {
                if (e.key === 'ArrowDown') document.querySelector('#mainGrid .focusable').focus();
                else if (e.key === 'ArrowLeft') document.querySelector('.menu-item.active').focus();
                else if (e.key === 'Enter') showSearch();
            }
        }

        function showSearch() {
            document.getElementById('searchOverlay').classList.add('active');
            document.getElementById('searchInput').focus();
        }

        function hideSearch() {
            document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchIcon').focus();
        }

        window.onload = async () => {
            // تحميل حالة وضع الأداء
            const isLow = localStorage.getItem('lowPerfTV') === 'true';
            updatePerfUI(isLow);

            try {
                const response = await fetch('database.json');
                data = await response.json();
                rebuildTab('mainGrid', data.iraq || []);
            } catch (e) { console.error("Data Error", e); }

            document.getElementById('searchIcon').onclick = showSearch;
            document.getElementById('searchClose').onclick = hideSearch;

            document.getElementById('searchInput').oninput = (e) => {
                const q = e.target.value.toLowerCase();
                const all = Object.values(data).flat();
                const filtered = all.filter(ch => ch.name.toLowerCase().includes(q));
                rebuildTab('searchResults', filtered);
            };

            document.addEventListener('keydown', handleKeyNavigation);

            // مراقبة الفوكس لتصغير السايدبار تلقائياً
            document.addEventListener('focusin', (e) => {
                if (e.target.closest('.main-content') || e.target.closest('.search-overlay')) {
                    document.body.classList.add('channels-focused');
                } else {
                    document.body.classList.remove('channels-focused');
                }
            });

            setTimeout(() => document.querySelector('.menu-item').focus(), 500);
        };
    </script>
</body>
</html>
