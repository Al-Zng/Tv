<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq TV | القنوات العراقية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #161a21;
            --accent-green: #00d166;
            --text-white: #ffffff;
            --text-gray: #8e9297;
            --grid-columns: 4; 
        }

        @font-face {
            font-family: 'GE SS Two Bold';
            src: url('GE-SS-Two-Bold.otf') format('opentype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'GE SS Two Bold', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 25px 50px;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            background: var(--accent-green);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .hero {
            padding: 0 50px;
            margin-bottom: 25px;
        }

        .hero-banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #1a2424 0%, #0a0c10 100%);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .live-tag {
            background: #ff3b30;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 10px;
            width: fit-content;
        }

        .tabs {
            display: flex;
            gap: 12px;
            padding: 0 50px;
            margin-bottom: 25px;
        }

        .tab {
            padding: 10px 25px;
            background: #1c222b;
            border-radius: 12px;
            color: var(--text-gray);
        }

        .tab.active {
            background: var(--accent-green);
            color: white;
        }

        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 50px 40px;
            display: grid;
            grid-template-columns: repeat(var(--grid-columns), 1fr);
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .card.focused {
            border-color: var(--accent-green);
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-img {
            background: white;
            width: 100%;
            height: 110px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .card-img img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .card h3 {
            font-size: 18px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        #status-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            padding: 12px 30px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            text-align: center;
            white-space: nowrap;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .grid-container::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <div id="loader"><i class="fas fa-spinner fa-spin fa-3x" style="color: var(--accent-green);"></i></div>

    <header class="header">
        <div style="display: flex; gap: 15px;">
            <div class="logo-box" style="background: #1c222b;"><i class="fas fa-cog"></i></div>
            <div class="logo-box" style="background: #1c222b;"><i class="fas fa-search"></i></div>
        </div>
        <div class="header-right">
            <div style="text-align: right;">
                <h1 style="font-size: 22px;">القنوات العراقية</h1>
                <p style="font-size: 11px; color: var(--text-gray);">IRAQI TV HUB</p>
            </div>
            <div class="logo-box"><i class="fas fa-mosque"></i></div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-banner">
            <span class="live-tag">مباشر • تغطية خاصة</span>
            <h2 style="font-size: 26px;">أحداث العاصمة بغداد والشرق الأوسط الآن</h2>
        </div>
    </section>

    <nav class="tabs">
        <div class="tab active">الكل</div>
        <div class="tab">إخبارية</div>
        <div class="tab">ترفيهية</div>
    </nav>

    <main class="grid-container" id="channelGrid"></main>

    <div id="status-toast">جاري الفتح في VLC...</div>

    <script>
        const channels = [
            {
                name: "الاخبارية العامة",
                url: "http://cdn.catiacast.video/abr/8d2ffb0aba244e8d9101a9488a7daa05/playlist.m3u8",
                image: "1.jpeg"
            },
            {
                name: "العراقية الإخبارية",
                url: "https://cdn.catiacast.video/abr/78054972db7708422595bc96c6e024ac/playlist.m3u8",
                image: "2.jpeg"
            },
            {
                name: "MBC Iraq",
                url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/9/99/MBC_Iraq.svg"
            },
            {
                name: "Utv",
                url: "https://mn-nl.mncdn.com/utviraqi2/64c80359/index.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/5/55/Utv_logo.png"
            },
            {
                name: "الرابعة",
                url: "https://rtmp.itiraq.tv/live/news/playlist.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg/500px-%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg.png"
            },
            {
                name: "الشرقية",
                url: "https://indexforce.com/home/mystream/playlist.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Al_Sharqiya.png"
            }
        ];

        const grid = document.getElementById('channelGrid');
        let currentIndex = 0;
        const columns = 4;

        // إنشاء البطاقات بدون onclick (سنستخدم معالج عام)
        channels.forEach((ch, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-url', ch.url);
            card.setAttribute('data-name', ch.name);
            card.innerHTML = `
                <div class="card-img">
                    <img src="${ch.image}" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(ch.name)}'">
                </div>
                <h3>${ch.name}</h3>
            `;
            grid.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');

        function updateFocus(newIndex) {
            if (newIndex >= 0 && newIndex < cards.length) {
                cards[currentIndex].classList.remove('focused');
                currentIndex = newIndex;
                cards[currentIndex].classList.add('focused');
                cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // debounce لمنع تكرار الفتح عند الضغط المطول
        let opening = false;
        function openFocusedChannel() {
            if (opening) return;
            opening = true;

            const card = cards[currentIndex];
            const url = card.dataset.url;
            const name = card.dataset.name;

            const toast = document.getElementById('status-toast');
            toast.style.display = 'block';
            toast.textContent = `فتح ${name} في VLC...`;

            if (/Android/i.test(navigator.userAgent)) {
                const intentUrl = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(name)};end`;
                window.location.href = intentUrl;
            } else {
                window.location.href = `vlc://${url}`;
            }

            setTimeout(() => {
                toast.style.display = 'none';
                opening = false; // إعادة تعيين الحاجز بعد 3 ثوانٍ
            }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight': updateFocus(currentIndex + 1); break;
                case 'ArrowLeft': updateFocus(currentIndex - 1); break;
                case 'ArrowDown': if (currentIndex + columns < cards.length) updateFocus(currentIndex + columns); break;
                case 'ArrowUp': if (currentIndex - columns >= 0) updateFocus(currentIndex - columns); break;
                case 'Enter': case 'OK':
                    e.preventDefault(); // منع أي سلوك افتراضي
                    openFocusedChannel();
                    break;
            }
        });

        // دعم النقر بالماوس/اللمس (للمتصفحات العادية)
        cards.forEach((card, idx) => {
            card.addEventListener('click', () => {
                updateFocus(idx);
                openFocusedChannel();
            });
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                updateFocus(0);
            }, 800);
        });
    </script>
</body>
</html>
