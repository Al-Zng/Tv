<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Tv Pro - قنوات محدثة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --sidebar-bg: #1a2a33; 
            --main-bg: #050505; 
            --search-bg: #f59f34; 
            --accent-green: #00d166;
            --sidebar-width: 280px;
            --sidebar-collapsed-width: 90px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }

        body { background-color: var(--main-bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width); background-color: var(--sidebar-bg);
            display: flex; flex-direction: column; padding: 40px 15px;
            z-index: 100; transition: 0.3s ease;
            overflow-y: auto;
        }
        body.channels-focused .sidebar { width: var(--sidebar-collapsed-width); }

        .search-btn {
            width: 55px; height: 55px; background: var(--search-bg);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 22px; margin-bottom: 40px; border: none; outline: none;
            cursor: pointer;
        }

        .menu-title { font-weight: bold; margin-bottom: 20px; color: #4db8d8; font-size: 14px; }
        .menu-item {
            height: 55px; display: flex; align-items: center; color: #a0c4d1;
            padding: 0 18px; border-radius: 12px; transition: 0.3s; outline: none; border: 2px solid transparent; margin-bottom: 10px;
        }
        .menu-item i { min-width: 30px; margin-left: 20px; font-size: 22px; }
        .menu-item.active { background: rgba(255,255,255,0.1); color: white; border-color: white; }
        body.channels-focused .menu-item span, body.channels-focused .menu-title { display: none; }

        .focusable:focus { transform: scale(1.08); border-color: white; background: rgba(255, 255, 255, 0.1); }

        /* --- Main Content --- */
        .main-content { flex: 1; padding: 40px; position: relative; overflow: hidden; }
        .top-logo { font-size: 36px; font-weight: 800; color: #4db8d8; margin-bottom: 20px; }
        
        .tab-content { display: none; height: calc(100vh - 120px); overflow-y: auto; scroll-behavior: smooth; }
        .tab-content.active { display: block; }

        .section-header { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: white; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .channel-card {
            aspect-ratio: 16 / 9; background: #111; border-radius: 15px;
            overflow: hidden; outline: none; border: 3px solid transparent;
            display: flex; justify-content: center; align-items: center;
            transition: 0.25s; position: relative; cursor: pointer;
            will-change: transform;
        }
        .channel-card:focus { transform: scale(1.1); border-color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 10; }
        .channel-card img { width: 65%; height: 65%; object-fit: contain; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 75%);
            display: flex; align-items: flex-end; padding: 10px;
        }
        .channel-name { font-weight: bold; font-size: 13px; color: white; }

        #status-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--accent-green); color: black; padding: 15px 30px; border-radius: 50px;
            display: none; z-index: 2000; font-weight: bold;
        }

        /* --- شريط البحث --- */
        .search-overlay {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            background: #1e2e3a;
            border-radius: 60px;
            padding: 5px 20px;
            display: none;
            align-items: center;
            z-index: 300;
            border: 2px solid var(--search-bg);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .search-overlay.active { display: flex; }
        .search-overlay i { color: var(--search-bg); font-size: 22px; margin-left: 15px; }
        .search-overlay input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            padding: 15px 0;
            outline: none;
            font-family: 'Tajawal', sans-serif;
        }
        .search-overlay input::placeholder { color: #a0c4d1; }
        .search-close {
            background: none;
            border: none;
            color: #a0c4d1;
            font-size: 28px;
            cursor: pointer;
            margin-right: 10px;
            line-height: 1;
        }
        .search-close:focus { color: white; outline: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="search-btn focusable" tabindex="0" id="searchIcon"><i class="fas fa-search"></i></div>
        <div class="menu-title">الفئات</div>
        <div class="menu-item focusable active" tabindex="0" onclick="showTab('iraq-tab', this)"><i class="fas fa-flag"></i> <span>العراق</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('mbc-tab', this)"><i class="fas fa-play"></i> <span>باقة MBC</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('sports-tab', this)"><i class="fas fa-running"></i> <span>الرياضة</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('doc-tab', this)"><i class="fas fa-atlas"></i> <span>الوثائقية</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('misc-tab', this)"><i class="fas fa-ellipsis-h"></i> <span>متنوعات</span></div>
        <!-- التبويبات الجديدة (بدون ألوان) -->
        <div class="menu-item focusable" tabindex="0" onclick="showTab('bein-tab', this)"><i class="fas fa-futbol"></i> <span>بي إن سبورت</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('osn-tab', this)"><i class="fas fa-film"></i> <span>OSN</span></div>
        <div class="menu-item focusable" tabindex="0" onclick="showTab('netflix-tab', this)"><i class="fab fa-netflix"></i> <span>VIP Netflix</span></div>
    </aside>

    <main class="main-content">
        <div class="top-logo">Iraq Tv <span>Max</span></div>

        <!-- طبقة البحث -->
        <div class="search-overlay" id="searchOverlay">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن قناة..." autocomplete="off">
            <button class="search-close focusable" id="searchClose" tabindex="0">&times;</button>
        </div>

        <!-- التبويبات الأصلية -->
        <div id="iraq-tab" class="tab-content active">
            <div class="section-header">العراق</div>
            <div class="movies-grid" id="iraqGrid"></div>
        </div>

        <div id="mbc-tab" class="tab-content">
            <div class="section-header">MBC</div>
            <div class="movies-grid" id="mbcGrid"></div>
        </div>

        <div id="sports-tab" class="tab-content">
            <div class="section-header">الرياضة</div>
            <div class="movies-grid" id="sportsGrid"></div>
        </div>

        <div id="doc-tab" class="tab-content">
            <div class="section-header">الوثائقية</div>
            <div class="movies-grid" id="docGrid"></div>
        </div>

        <div id="misc-tab" class="tab-content">
            <div class="section-header">متنوعات</div>
            <div class="movies-grid" id="miscGrid"></div>
        </div>

        <!-- التبويبات الجديدة -->
        <div id="bein-tab" class="tab-content">
            <div class="section-header">باقة بي إن سبورت</div>
            <div class="movies-grid" id="beinGrid"></div>
        </div>

        <div id="osn-tab" class="tab-content">
            <div class="section-header">OSN</div>
            <div class="movies-grid" id="osnGrid"></div>
        </div>

        <div id="netflix-tab" class="tab-content">
            <div class="section-header">VIP Netflix</div>
            <div class="movies-grid" id="netflixGrid"></div>
        </div>

        <!-- شبكة نتائج البحث -->
        <div id="searchResults" style="display: none;">
            <div class="section-header">نتائج البحث</div>
            <div class="movies-grid" id="searchGrid"></div>
        </div>
    </main>

    <div id="status-toast">جاري الفتح في VLC...</div>

    <script>
        // ==================== متغير عام للبيانات ====================
        let data = {};

        // ==================== دوال العرض الأساسية ====================
        let observer = null;

        function initLazyLoading() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.getAttribute('data-src');
                        if (src) {
                            img.src = src;
                            img.removeAttribute('data-src');
                            observer.unobserve(img);
                        }
                    }
                });
            }, { rootMargin: '200px' });

            document.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));
        }

        function rebuildTab(gridId, list) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = '';
            list.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card focusable';
                card.tabIndex = 0;
                card.innerHTML = `<img data-src="${ch.img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3C/svg%3E" loading="lazy" onerror="this.src='https://via.placeholder.com/200x150?text=TV'"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                card.onclick = () => openVLC(ch.url, ch.name);
                grid.appendChild(card);
            });
            initLazyLoading();
        }

        function clearTab(gridId) {
            const grid = document.getElementById(gridId);
            if (grid) grid.innerHTML = '';
        }

        function populateAllTabs() {
            if (!data) return;
            rebuildTab('iraqGrid', data.iraq || []);
            rebuildTab('mbcGrid', data.mbc || []);
            rebuildTab('sportsGrid', data.sports || []);
            rebuildTab('docGrid', data.doc || []);
            rebuildTab('miscGrid', data.misc || []);
            rebuildTab('beinGrid', data.bein || []);
            rebuildTab('osnGrid', data.osn || []);
            rebuildTab('netflixGrid', data.netflix || []);
        }

        function getKeyFromGridId(gridId) {
            if (gridId === 'iraqGrid') return 'iraq';
            if (gridId === 'mbcGrid') return 'mbc';
            if (gridId === 'sportsGrid') return 'sports';
            if (gridId === 'docGrid') return 'doc';
            if (gridId === 'miscGrid') return 'misc';
            if (gridId === 'beinGrid') return 'bein';
            if (gridId === 'osnGrid') return 'osn';
            if (gridId === 'netflixGrid') return 'netflix';
            return null;
        }

        function showTab(tabId, el) {
            hideSearch();

            const currentActiveTab = document.querySelector('.tab-content.active');
            if (currentActiveTab) {
                const currentGridId = currentActiveTab.querySelector('.movies-grid')?.id;
                if (currentGridId) clearTab(currentGridId);
            }

            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (el) el.classList.add('active');

            const newGridId = document.getElementById(tabId).querySelector('.movies-grid')?.id;
            if (newGridId && document.getElementById(newGridId).children.length === 0) {
                rebuildTab(newGridId, data[getKeyFromGridId(newGridId)] || []);
            }

            setTimeout(() => {
                const firstCard = document.getElementById(tabId).querySelector('.channel-card');
                if (firstCard) firstCard.focus();
            }, 100);
        }

        function openVLC(url, name) {
            const toast = document.getElementById('status-toast');
            toast.style.display = 'block';
            toast.textContent = `فتح ${name}...`;
            if (/Android/i.test(navigator.userAgent)) {
                window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(name)};end`;
            } else {
                window.location.href = `vlc://${url}`;
            }
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function showSearch() {
            document.getElementById('searchOverlay').classList.add('active');
            document.getElementById('searchInput').focus();

            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('searchResults').style.display = 'block';
        }

        function hideSearch() {
            document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';

            document.querySelectorAll('.tab-content').forEach(t => t.style.display = '');
        }

        function filterChannels(query) {
            if (!query.trim()) {
                hideSearch();
                return;
            }
            const allChannels = [
                ...(data.iraq || []),
                ...(data.mbc || []),
                ...(data.sports || []),
                ...(data.doc || []),
                ...(data.misc || []),
                ...(data.bein || []),
                ...(data.osn || []),
                ...(data.netflix || [])
            ];
            const filtered = allChannels.filter(ch => 
                ch.name.toLowerCase().includes(query.toLowerCase())
            );
            const searchGrid = document.getElementById('searchGrid');
            searchGrid.innerHTML = '';
            if (filtered.length === 0) {
                searchGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#888;">لا توجد قنوات مطابقة</div>';
            } else {
                filtered.forEach(ch => {
                    const card = document.createElement('div');
                    card.className = 'channel-card focusable';
                    card.tabIndex = 0;
                    card.innerHTML = `<img data-src="${ch.img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3C/svg%3E" loading="lazy" onerror="this.src='https://via.placeholder.com/200x150?text=TV'"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                    card.onclick = () => openVLC(ch.url, ch.name);
                    searchGrid.appendChild(card);
                });
                initLazyLoading();
            }
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('searchResults').style.display = 'block';
        }

        function handleKeyNavigation(e) {
            const focusableSelectors = '.focusable, .search-overlay input, .search-close, .channel-card';
            const focusables = Array.from(document.querySelectorAll(focusableSelectors)).filter(el => 
                el.offsetParent !== null && !el.disabled && getComputedStyle(el).display !== 'none'
            );

            let current = document.activeElement;

            if (!current || current === document.body) {
                if (focusables.length > 0) {
                    e.preventDefault();
                    focusables[0].focus();
                }
                return;
            }

            if (e.key === 'Enter' || e.key === 'OK') {
                e.preventDefault();
                if (current && current.click) {
                    current.click();
                }
                return;
            }

            const key = e.key;
            if (!['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft'].includes(key)) return;

            e.preventDefault();

            const currentRect = current.getBoundingClientRect();
            let bestCandidate = null;
            let bestDistance = Infinity;

            focusables.forEach(el => {
                if (el === current) return;

                const rect = el.getBoundingClientRect();
                let condition = false;
                let distance = 0;

                switch (key) {
                    case 'ArrowRight':
                        condition = rect.left > currentRect.right - 10;
                        if (condition) distance = Math.hypot(rect.left - currentRect.right, rect.top - currentRect.top);
                        break;
                    case 'ArrowLeft':
                        condition = rect.right < currentRect.left + 10;
                        if (condition) distance = Math.hypot(currentRect.left - rect.right, rect.top - currentRect.top);
                        break;
                    case 'ArrowDown':
                        condition = rect.top > currentRect.bottom - 10;
                        if (condition) distance = Math.hypot(rect.left - currentRect.left, rect.top - currentRect.bottom);
                        break;
                    case 'ArrowUp':
                        condition = rect.bottom < currentRect.top + 10;
                        if (condition) distance = Math.hypot(rect.left - currentRect.left, currentRect.top - rect.bottom);
                        break;
                }

                if (condition && distance < bestDistance) {
                    bestDistance = distance;
                    bestCandidate = el;
                }
            });

            if (bestCandidate) {
                bestCandidate.focus();
                bestCandidate.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // ==================== تحميل البيانات من ملف JSON ====================
        window.onload = async () => {
            try {
                const response = await fetch('database.json');
                if (!response.ok) throw new Error('فشل تحميل البيانات');
                data = await response.json();
            } catch (error) {
                console.error(error);
                data = {}; // بيانات فارغة في حال الفشل
            } finally {
                populateAllTabs();
            }

            document.getElementById('searchIcon').addEventListener('click', (e) => {
                e.stopPropagation();
                if (document.getElementById('searchOverlay').classList.contains('active')) {
                    hideSearch();
                } else {
                    showSearch();
                }
            });

            document.getElementById('searchClose').addEventListener('click', hideSearch);

            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterChannels(e.target.value);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('searchOverlay').classList.contains('active')) {
                    hideSearch();
                }
            });

            document.addEventListener('keydown', handleKeyNavigation);

            document.addEventListener('focusin', (e) => {
                if (e.target.closest('.movies-grid') || e.target.closest('#searchResults')) {
                    document.body.classList.add('channels-focused');
                } else {
                    document.body.classList.remove('channels-focused');
                }
            });

            initLazyLoading();

            setTimeout(() => {
                const firstCard = document.querySelector('.channel-card');
                if (firstCard) firstCard.focus();
            }, 500);
        };
    </script>
</body>
</html>
