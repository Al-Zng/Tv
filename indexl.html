<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq TV | القنوات العراقية</title>
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts: Rubik (احتياطي) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @font-face {
            font-family: 'GE SS Two Bold';
            src: url('GE-SS-Two-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #0a0f1a;          /* أسود مزرق */
            --bg-card: #141c2c;           /* أزرق داكن جداً */
            --accent-blue: #1e4f8a;        /* أزرق غامق */
            --accent-light: #2a6bb0;       /* أزرق متوسط */
            --text-light: #ffffff;
            --text-muted: #b0c4de;
            --card-hover-bg: #1f2b3f;
            --border-radius: 20px;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'GE SS Two Bold', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, #1a2538, #0a0f1a 80%);
        }

        /* الهيدر */
        .header {
            padding: 25px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(10, 15, 26, 0.8);
        }

        .header i {
            font-size: 36px;
            color: var(--accent-blue);
            background: rgba(30, 79, 138, 0.2);
            padding: 12px;
            border-radius: 50%;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* شاشة التحميل */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.3s ease;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid var(--accent-light);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-screen p {
            font-size: 22px;
            color: var(--accent-light);
        }

        /* قائمة القنوات */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            align-content: start;
        }

        /* بطاقة القناة */
        .channel-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 25px 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .channel-card.focused {
            border-color: var(--accent-light);
            background: var(--card-hover-bg);
            transform: scale(1.05);
        }

        /* حاوية الصورة - الآن مستطيلة بدون اقتصاص */
        .channel-avatar {
            width: 100%;
            height: 70%; /* ارتفاع ثابت للصورة */
            background: linear-gradient(145deg, var(--accent-blue), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: 700;
            color: white;
            border: 3px solid rgba(255,255,255,0.2);
            overflow: hidden;
            border-radius: 12px; /* زوايا خفيفة (اختياري) */
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: 10%; /* يغطي الحاوية بالكامل، قد يُقص بعض أطراف الصورة. إذا أردت الصورة كاملة بدون قص استخدم contain مع خلفية سوداء */
            /* إذا كنت تفضل رؤية الصورة كاملة بدون قص استخدم:
               object-fit: contain;
               background-color: #000; */
        }

        /* اسم القناة */
        .channel-name {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
            color: var(--text-light);
            padding: 0 5px;
        }

        /* رسالة الحالة */
        #status-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 28, 44, 0.9);
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 18px;
            color: var(--accent-light);
            border: 1px solid var(--accent-light);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        #status-msg i {
            font-size: 22px;
        }

        /* شريط التمرير */
        .channel-list::-webkit-scrollbar {
            width: 8px;
        }
        .channel-list::-webkit-scrollbar-track {
            background: #1a1a2a;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 10px;
        }

        .no-channels {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 24px;
            padding: 50px;
        }
    </style>
</head>
<body>
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>جاري تحميل القنوات...</p>
    </div>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="header">
            <i class="fas fa-tv"></i>
            <h1><span>IRAQ</span> TV</h1>
        </div>

        <!-- قائمة القنوات -->
        <div class="channel-list" id="channelList"></div>

        <!-- رسالة الحالة -->
        <div id="status-msg">
            <i class="fas fa-circle-notch fa-spin"></i> جاري الفتح في VLC...
        </div>
    </div>

    <script>
        // قائمة القنوات (يمكن تعديلها أو جلبها من API)
        const channels = [
            {
                name: "الاخبارية العامة",
                url: "http://cdn.catiacast.video/abr/8d2ffb0aba244e8d9101a9488a7daa05/playlist.m3u8",
                image: "1.jpeg"
            },
            {
                name: "العراقية الإخبارية",
                url: "https://cdn.catiacast.video/abr/78054972db7708422595bc96c6e024ac/playlist.m3u8",
                image: "2.jpeg"
            },
            {
                name: "MBC Iraq",
                url: "https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-iraq/e38c44b1b43474e1c39cb5b90203691e/index.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/9/99/MBC_Iraq.svg"
            },
            {
                name: "Utv",
                url: "https://mn-nl.mncdn.com/utviraqi2/64c80359/index.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/5/55/Utv_logo.png"
            },
            {
                name: "الرابعة",
                url: "https://rtmp.itiraq.tv/live/news/playlist.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg/500px-%D8%B4%D8%B9%D8%A7%D8%B1_%D9%82%D9%86%D8%A7%D8%A9_%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9%D8%A9.svg.png"
            },
            {
                name: "الشرقية",
                url: "https://indexforce.com/home/mystream/playlist.m3u8",
                image: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Al_Sharqiya.png"
            }
        ];

        const channelListContainer = document.getElementById('channelList');
        const statusMsg = document.getElementById('status-msg');
        const loadingScreen = document.getElementById('loadingScreen');
        let currentIndex = 0;
        let channelElements = [];

        // إنشاء البطاقات
        channels.forEach((ch, index) => {
            const card = document.createElement('div');
            card.className = 'channel-card';

            const avatar = document.createElement('div');
            avatar.className = 'channel-avatar';

            if (ch.image && ch.image.trim() !== '') {
                const img = document.createElement('img');
                img.src = ch.image;
                img.alt = ch.name;
                // معالجة خطأ تحميل الصورة (اختياري)
                img.onerror = function() {
                    // إذا فشلت الصورة، نعرض الحرف الأول
                    avatar.innerHTML = ch.name.charAt(0);
                    avatar.style.display = 'flex';
                };
                avatar.appendChild(img);
            } else {
                avatar.textContent = ch.name.charAt(0);
            }

            const nameEl = document.createElement('div');
            nameEl.className = 'channel-name';
            nameEl.textContent = ch.name;

            card.appendChild(avatar);
            card.appendChild(nameEl);

            card.onclick = () => { openInVLC(ch.url, index); };

            channelListContainer.appendChild(card);
            channelElements.push(card);
        });

        // إخفاء شاشة التحميل بعد تجهيز القنوات
        window.addEventListener('load', function() {
            // نعطي مهلة بسيطة للتأكد من ظهور كل شيء
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 500);
        });

        // تحديث التركيز
        function updateFocus(index) {
            if (index < 0 || index >= channelElements.length) return;
            if (channelElements[currentIndex]) {
                channelElements[currentIndex].classList.remove('focused');
            }
            currentIndex = index;
            channelElements[currentIndex].classList.add('focused');
            channelElements[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // فتح القناة في VLC
        function openInVLC(streamUrl, index) {
            updateFocus(index);
            statusMsg.style.display = 'flex';

            const vlcUrl = "vlc-x-callback://x-callback-url/stream?url=" + encodeURIComponent(streamUrl);
            const fallbackUrl = "vlc://" + streamUrl;

            window.location.href = vlcUrl;

            setTimeout(() => {
                window.location.href = fallbackUrl;
                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 2000);
            }, 1000);
        }

        // التحكم بالأزرار
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key.startsWith('Arrow') || key === 'Enter' || key === 'OK') {
                e.preventDefault();
            }

            switch(key) {
                case 'ArrowDown':
                case 'ArrowRight':
                    if (currentIndex < channelElements.length - 1) updateFocus(currentIndex + 1);
                    break;
                case 'ArrowUp':
                case 'ArrowLeft':
                    if (currentIndex > 0) updateFocus(currentIndex - 1);
                    break;
                case 'Enter':
                case 'OK':
                    openInVLC(channels[currentIndex].url, currentIndex);
                    break;
            }
        });

        // بدء التركيز على أول قناة
        if (channelElements.length > 0) {
            updateFocus(0);
        } else {
            channelListContainer.innerHTML = '<div class="no-channels">لا توجد قنوات متاحة</div>';
        }
    </script>
</body>
</html>
