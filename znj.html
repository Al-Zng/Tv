<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Tv Pro - Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root {
            --bottom-nav-bg: #1a2a33; 
            --main-bg: #050505; 
            --search-bg: #f59f34;
            --accent-green: #00d166;
            --text-blue: #4db8d8;
        }

        /* منع التحديد والنسخ */
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body { background-color: var(--main-bg);
            color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* وضع الأداء الضعيف */
        body.perf-low * {
            animation: none !important;
            transition: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
        }

        @keyframes fadeInUp {
            from { opacity: 0;
            transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0);
            }
        }
        .animate-tab { animation: fadeInUp 0.4s ease-out forwards;
        }

        header {
            display: flex;
            justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--main-bg); z-index: 1000;
        }
        .top-logo { font-size: 24px; font-weight: 800; color: var(--text-blue);
        }
        .menu-toggle { font-size: 20px; color: white; cursor: pointer; }

        .main-content { flex: 1;
            overflow-y: auto; padding: 10px 15px 100px 15px; scroll-behavior: smooth; }
        
        .tab-content { display: none;
        }
        .tab-content.active { display: block;
        }

        .section-header { font-size: 20px; font-weight: bold; margin: 10px 0 20px 0;
            color: white; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .channel-card {
            aspect-ratio: 1/1;
            background: #111; border-radius: 12px;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            position: relative; border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .channel-card:active { transform: scale(0.92);
        }

        .channel-card img { width: 70%; height: 70%; object-fit: contain; pointer-events: none;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 80%);
            display: flex; align-items: flex-end; padding: 5px; justify-content: center;
        }
        .channel-name { font-weight: bold; font-size: 10px; color: white; text-align: center;
        }

        /* --- Sidebar للهاتف --- */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2500; display: none;
        }
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background: var(--bottom-nav-bg); z-index: 2600; transition: 0.3s ease;
            display: flex; flex-direction: column; padding: 20px;
        }
        .sidebar.active { right: 0; }
        .sidebar-header { font-size: 22px; font-weight: bold; color: var(--text-blue); margin-bottom: 30px; display: flex; justify-content: space-between; }
        .nav-item {
            display: flex; align-items: center; color: #a0c4d1; padding: 15px;
            border-radius: 10px; margin-bottom: 5px; transition: 0.3s;
        }
        .nav-item i { width: 30px; font-size: 18px; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .sidebar-footer { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        .search-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--main-bg); z-index: 2000; display: none;
            padding: 20px;
            overflow-y: auto;
        }
        .search-overlay.active { display: block; animation: fadeInUp 0.3s ease;
        }
        .search-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
        }
        .search-bar {
            flex: 1;
            background: #1e2e3a; border-radius: 10px;
            padding: 10px 15px; display: flex; align-items: center;
        }
        .search-bar input {
            background: transparent;
            border: none; color: white; flex: 1; outline: none; font-size: 16px;
        }
        .close-search { font-size: 24px; color: var(--text-blue);
        }

        /* نافذة الإعدادات */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #1a2a33; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-save { background: var(--text-blue); color: #000; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; }

        #status-toast {
            position: fixed;
            top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent-green); color: black; padding: 10px 20px;
            border-radius: 10px; display: none; z-index: 3000;
            font-weight: bold; font-size: 14px;
        }
    </style>
</head>
<body oncontextmenu="return false;"> 
    <div id="status-toast">جاري الفتح...</div>

    <header>
        <div class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="top-logo">Iraq Tv <span>Max</span></div>
        <div class="search-trigger" id="searchIcon"><i class="fas fa-search"></i></div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">القائمة <i class="fas fa-times" onclick="toggleSidebar()"></i></div>
        <div class="nav-item active" onclick="showTab('iraq-tab', this); toggleSidebar()"><i class="fas fa-flag"></i><span>العراق</span></div>
        <div class="nav-item" onclick="showTab('mbc-tab', this); toggleSidebar()"><i class="fas fa-play"></i><span>MBC</span></div>
        <div class="nav-item" onclick="showTab('sports-tab', this); toggleSidebar()"><i class="fas fa-running"></i><span>رياضة</span></div>
        <div class="nav-item" onclick="showTab('doc-tab', this); toggleSidebar()"><i class="fas fa-atlas"></i><span>وثائقية</span></div>
        <div class="nav-item" onclick="showTab('misc-tab', this); toggleSidebar()"><i class="fas fa-ellipsis-h"></i><span>متنوعات</span></div>
        <div class="nav-item" onclick="showTab('bein-tab', this); toggleSidebar()"><i class="fas fa-futbol"></i><span>بي إن</span></div>
        <div class="nav-item" onclick="showTab('osn-tab', this); toggleSidebar()"><i class="fas fa-film"></i><span>OSN</span></div>
        <div class="nav-item" onclick="showTab('netflix-tab', this); toggleSidebar()"><i class="fab fa-netflix"></i><span>Netflix</span></div>
        
        <div class="sidebar-footer">
            <div class="nav-item" onclick="toggleModal('settingsModal')"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; color: var(--text-blue);">إعدادات التطبيق</h3>
            <div class="setting-row">
                <span>وضع الأداء (ضعيف)</span>
                <input type="checkbox" id="perfToggle" style="width:20px; height:20px;">
            </div>
            <p style="font-size: 11px; color: #888; margin-bottom: 20px;">قم بتفعيل هذا الوضع إذا كان جهازك قديمًا لتقليل الأنيميشن وتوفير الطاقة.</p>
            <button class="btn-save" onclick="saveSettings()">حفظ وإغلاق</button>
        </div>
    </div>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-header">
            <div class="search-bar">
                <i class="fas fa-search" style="margin-left: 10px; color: #a0c4d1;"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن قناة...">
            </div>
            <i class="fas fa-times close-search" id="searchClose"></i>
        </div>
        <div class="movies-grid" id="searchGrid"></div>
    </div>

    <main class="main-content">
        <div id="iraq-tab" class="tab-content active animate-tab">
            <div class="section-header">العراق</div>
            <div class="movies-grid" id="iraqGrid"></div>
        </div>
        <div id="mbc-tab" class="tab-content animate-tab">
            <div class="section-header">باقة MBC</div>
            <div class="movies-grid" id="mbcGrid"></div>
        </div>
        <div id="sports-tab" class="tab-content animate-tab">
            <div class="section-header">الرياضة</div>
            <div class="movies-grid" id="sportsGrid"></div>
        </div>
        <div id="doc-tab" class="tab-content animate-tab">
            <div class="section-header">الوثائقية</div>
            <div class="movies-grid" id="docGrid"></div>
        </div>
        <div id="misc-tab" class="tab-content animate-tab">
            <div class="section-header">متنوعات</div>
            <div class="movies-grid" id="miscGrid"></div>
        </div>
        <div id="bein-tab" class="tab-content animate-tab">
            <div class="section-header">بي إن سبورت</div>
            <div class="movies-grid" id="beinGrid"></div>
        </div>
        <div id="osn-tab" class="tab-content animate-tab">
            <div class="section-header">OSN</div>
            <div class="movies-grid" id="osnGrid"></div>
        </div>
        <div id="netflix-tab" class="tab-content animate-tab">
            <div class="section-header">VIP Netflix</div>
            <div class="movies-grid" id="netflixGrid"></div>
        </div>
    </main>

    <script>
        let data = {};
        let observer = null;

        function toggleSidebar() {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('sidebarOverlay');
            side.classList.toggle('active');
            over.style.display = side.classList.contains('active') ? 'block' : 'none';
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveSettings() {
            const lowPerf = document.getElementById('perfToggle').checked;
            localStorage.setItem('lowPerf', lowPerf);
            applyPerfMode(lowPerf);
            toggleModal('settingsModal');
        }

        function applyPerfMode(isLow) {
            if(isLow) document.body.classList.add('perf-low');
            else document.body.classList.remove('perf-low');
        }

        function initLazyLoading() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.getAttribute('data-src');
                        if (src) {
                            img.src = src; 
                            img.removeAttribute('data-src');
                            observer.unobserve(img);
                        }
                    }
                });
            }, { rootMargin: '100px' });
            document.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));
        }

        function rebuildTab(gridId, list) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:#888;">لا توجد قنوات</div>';
                return;
            }
            list.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<img data-src="${ch.img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3C/svg%3E" onerror="this.src='https://via.placeholder.com/150?text=TV'"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                card.onclick = () => openVLC(ch.url, ch.name);
                grid.appendChild(card);
            });
            initLazyLoading();
        }

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
            const target = document.getElementById(tabId);
            target.classList.add('active');
            if (el) el.classList.add('active');
            document.querySelector('.main-content').scrollTop = 0;
        }

        function openVLC(url, name) {
            const toast = document.getElementById('status-toast');
            toast.style.display = 'block';
            toast.textContent = `فتح ${name}...`;
            if (/Android/i.test(navigator.userAgent)) {
                window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(name)};end`;
            } else {
                window.location.href = `vlc://${url}`;
            }
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        window.onload = async () => {
            // تحميل الإعدادات
            const lowPerf = localStorage.getItem('lowPerf') === 'true';
            document.getElementById('perfToggle').checked = lowPerf;
            applyPerfMode(lowPerf);

            try {
                const response = await fetch('database.json');
                if (!response.ok) throw new Error('فشل تحميل البيانات');
                data = await response.json();
            } catch (error) {
                console.error(error);
                data = {};
            } finally {
                rebuildTab('iraqGrid', data.iraq || []);
                rebuildTab('mbcGrid', data.mbc || []);
                rebuildTab('sportsGrid', data.sports || []);
                rebuildTab('docGrid', data.doc || []);
                rebuildTab('miscGrid', data.misc || []);
                rebuildTab('beinGrid', data.bein || []);
                rebuildTab('osnGrid', data.osn || []);
                rebuildTab('netflixGrid', data.netflix || []);
            }

            document.getElementById('searchIcon').onclick = () => document.getElementById('searchOverlay').classList.add('active');
            document.getElementById('searchClose').onclick = () => document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchInput').oninput = (e) => {
                const query = e.target.value.toLowerCase();
                const all = [
                    ...(data.iraq || []),
                    ...(data.mbc || []),
                    ...(data.sports || []),
                    ...(data.doc || []),
                    ...(data.misc || []),
                    ...(data.bein || []),
                    ...(data.osn || []),
                    ...(data.netflix || [])
                ];
                const filtered = all.filter(ch => ch.name.toLowerCase().includes(query));
                const grid = document.getElementById('searchGrid');
                grid.innerHTML = '';
                if (filtered.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:#888;">لا توجد نتائج</div>';
                } else {
                    filtered.forEach(ch => {
                        const card = document.createElement('div');
                        card.className = 'channel-card';
                        card.innerHTML = `<img src="${ch.img}" onerror="this.src='https://via.placeholder.com/150?text=TV'"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                        card.onclick = () => openVLC(ch.url, ch.name);
                        grid.appendChild(card);
                    });
                }
            };
        };

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
