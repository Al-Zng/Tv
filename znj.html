<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Tv Pro - Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --bottom-nav-bg: #1a2a33; 
            --main-bg: #050505; 
            --search-bg: #f59f34; 
            --accent-green: #00d166;
            --text-blue: #4db8d8;
        }

        /* منع التحديد والنسخ */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and Consumer Preview */
            user-select: none; /* Standard syntax */
        }

        body { background-color: var(--main-bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- الأنيميشن الجديد --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-tab { animation: fadeInUp 0.4s ease-out forwards; }

        /* --- Header --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--main-bg); z-index: 1000;
        }
        .top-logo { font-size: 24px; font-weight: 800; color: var(--text-blue); }
        .search-trigger { font-size: 20px; color: white; cursor: pointer; }

        /* --- Main Content --- */
        .main-content { flex: 1; overflow-y: auto; padding: 10px 15px 100px 15px; scroll-behavior: smooth; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-header { font-size: 20px; font-weight: bold; margin: 10px 0 20px 0; color: white; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .channel-card {
            aspect-ratio: 1/1; background: #111; border-radius: 12px;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            position: relative; border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* أنيميشن عند الضغط */
        .channel-card:active { transform: scale(0.92); }

        .channel-card img { width: 70%; height: 70%; object-fit: contain; pointer-events: none; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 80%);
            display: flex; align-items: flex-end; padding: 5px; justify-content: center;
        }
        .channel-name { font-weight: bold; font-size: 10px; color: white; text-align: center; }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 70px; background: var(--bottom-nav-bg);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #a0c4d1; font-size: 12px; transition: 0.3s; flex: 1;
        }
        .nav-item i { font-size: 20px; margin-bottom: 5px; }
        .nav-item.active { color: var(--text-blue); transform: translateY(-2px); }

        /* --- Search Overlay --- */
        .search-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--main-bg); z-index: 2000; display: none;
            padding: 20px;
        }
        .search-overlay.active { display: block; animation: fadeInUp 0.3s ease; }
        .search-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .search-bar {
            flex: 1; background: #1e2e3a; border-radius: 10px;
            padding: 10px 15px; display: flex; align-items: center;
        }
        .search-bar input {
            background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 16px;
        }
        .close-search { font-size: 24px; color: var(--text-blue); }

        #status-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent-green); color: black; padding: 10px 20px;
            border-radius: 10px; display: none; z-index: 3000; font-weight: bold; font-size: 14px;
        }
    </style>
</head>

        // المنطق الأساسي
        let observer = null;

        function initLazyLoading() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.getAttribute('data-src');
                        if (src) { img.src = src; img.removeAttribute('data-src'); observer.unobserve(img); }
                    }
                });
            }, { rootMargin: '100px' });
            document.querySelectorAll('img[data-src]').forEach(img => observer.observe(img));
        }

        function rebuildTab(tabId, list) {
            const grid = document.getElementById(tabId);
            if (!grid) return;
            grid.innerHTML = '';
            list.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<img data-src="${ch.img}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3C/svg%3E"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                card.onclick = () => openVLC(ch.url, ch.name);
                grid.appendChild(card);
            });
            initLazyLoading();
        }

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
            const target = document.getElementById(tabId);
            target.classList.add('active');
            if (el) el.classList.add('active');
            window.scrollTo(0,0);
        }

        function openVLC(url, name) {
            const toast = document.getElementById('status-toast');
            toast.style.display = 'block';
            toast.textContent = `فتح ${name}...`;
            if (/Android/i.test(navigator.userAgent)) {
                window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(name)};end`;
            } else {
                window.location.href = `vlc://${url}`;
            }
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // البحث
        document.getElementById('searchIcon').onclick = () => document.getElementById('searchOverlay').classList.add('active');
        document.getElementById('searchClose').onclick = () => document.getElementById('searchOverlay').classList.remove('active');
        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const all = [...data.iraq, ...data.mbc, ...data.sports, ...data.doc, ...data.misc];
            const filtered = all.filter(ch => ch.name.toLowerCase().includes(query));
            const grid = document.getElementById('searchGrid');
            grid.innerHTML = '';
            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<img src="${ch.img}"><div class="card-overlay"><div class="channel-name">${ch.name}</div></div>`;
                card.onclick = () => openVLC(ch.url, ch.name);
                grid.appendChild(card);
            });
        };

        // --- كود حماية إضافي (تعطيل الاختصارات) ---
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 's')) {
                e.preventDefault();
            }
        });

        window.onload = () => {
            rebuildTab('iraqGrid', data.iraq);
            rebuildTab('mbcGrid', data.mbc);
            rebuildTab('sportsGrid', data.sports);
            rebuildTab('docGrid', data.doc);
            rebuildTab('miscGrid', data.misc);
        };
    </script>
